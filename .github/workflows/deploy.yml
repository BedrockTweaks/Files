name: Deploy

on:
  push:
    branches:
      - devel
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        type: choice
        options:
          - devel
          - main
        default: devel

concurrency:
  group: files-deploy-${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.branch == 'main' && 'prod' || 'dev' }}
    steps:
      - name: Sync content on server
        uses: appleboy/ssh-action@v1.2.2
        env:
          FILES_BRANCH: ${{ inputs.branch || github.ref_name }}
          FILES_SOURCE_DIR: ${{ vars.FILES_SOURCE_DIR }}
          FILES_DEPLOY_DIR: ${{ vars.FILES_DEPLOY_DIR }}
        with:
          host: ${{ secrets.SERVER_ADDRESS }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          command_timeout: 30m
          envs: FILES_BRANCH,FILES_SOURCE_DIR,FILES_DEPLOY_DIR
          script: |
            set -eu

            branch="$FILES_BRANCH"
            source_dir="$FILES_SOURCE_DIR"
            target_dir="$FILES_DEPLOY_DIR"

            case "$branch:$source_dir:$target_dir" in
              devel:/opt/bedrock_tweaks/.files_source_devel:/opt/bedrock_tweaks/files_dev | \
              main:/opt/bedrock_tweaks/.files_source_main:/opt/bedrock_tweaks/files)
                ;;
              *)
                echo 'Branch and environment paths do not match.' >&2
                exit 1
                ;;
            esac

            command -v git >/dev/null
            command -v git-lfs >/dev/null
            command -v rsync >/dev/null

            repo_url=https://github.com/BedrockTweaks/Files.git
            export GIT_LFS_SKIP_SMUDGE=1

            if [ ! -d "$source_dir/.git" ]; then
              git clone --depth=1 --filter=blob:none --sparse --branch "$branch" "$repo_url" "$source_dir"
            fi

            if [ "$(git -C "$source_dir" remote get-url origin)" != "$repo_url" ]; then
              echo "Unexpected Git remote in $source_dir" >&2
              exit 1
            fi

            git -C "$source_dir" sparse-checkout set addons resource_packs crafting_tweaks
            git -C "$source_dir" fetch --depth=1 origin "$branch"
            git -C "$source_dir" reset --hard FETCH_HEAD
            git -C "$source_dir" clean -fdx
            git -C "$source_dir" lfs pull --include='addons,resource_packs,crafting_tweaks'

            # LATER: Include the addon build script and its dependencies in the sparse checkout.
            # Run the local Node build here and wait for success before syncing addons.

            mkdir -p "$target_dir"
            for section in addons resource_packs crafting_tweaks; do
              test -f "$source_dir/$section/packs.json"
              mkdir -p "$target_dir/$section"
              rsync -a --delete-delay --delay-updates \
                "$source_dir/$section/" "$target_dir/$section/"
              # The API uses packs.json mtime to refresh its icon lookup cache.
              touch "$target_dir/$section/packs.json"
            done

            echo "Deployed $(git -C "$source_dir" rev-parse --short HEAD) from $branch"
